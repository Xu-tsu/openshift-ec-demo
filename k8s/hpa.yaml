# Scale the storefront out when traffic spikes, and back in when it calms down.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  # Always keep 2 Pods so a single Pod/server failure never stops the shop.
  minReplicas: 2
  maxReplicas: 5
  behavior:
    # Demo setting: scale back in after 1 minute of low load (Kubernetes default is 5 minutes).
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
