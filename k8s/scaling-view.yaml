# Scaling Live View: animated dashboard for the autoscaling demo (Pods, per-Pod traffic, HPA, req/s).
# Code lives in k8s/scaling-view/ and is mounted from a generated ConfigMap (see kustomization.yaml).
# Reading router metrics also needs tools/scaling-view-monitoring.yaml (cluster-scoped, applied once by an admin).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaling-view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaling-view
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [loadgenerator]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaling-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scaling-view
subjects:
  - kind: ServiceAccount
    name: scaling-view
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaling-view
  labels:
    app: scaling-view
    app.kubernetes.io/part-of: demo-tools
    app.openshift.io/runtime: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaling-view
  template:
    metadata:
      labels:
        app: scaling-view
    spec:
      serviceAccountName: scaling-view
      securityContext:
        runAsNonRoot: true
      containers:
        - name: server
          image: registry.access.redhat.com/ubi9/ubi:latest
          command: ["python3", "/app/server.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: scaling-view-app
---
apiVersion: v1
kind: Service
metadata:
  name: scaling-view
  labels:
    app: scaling-view
spec:
  selector:
    app: scaling-view
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: scaling-view
  labels:
    app: scaling-view
spec:
  to:
    kind: Service
    name: scaling-view
  port:
    targetPort: http
