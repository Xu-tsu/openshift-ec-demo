# Lets the scaling-view ServiceAccount read OpenShift monitoring (router req/s per Pod via Thanos Querier).
# Cluster-scoped, so it is applied once by a cluster admin instead of Argo CD:
#   oc apply -f tools/scaling-view-monitoring.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boutique-scaling-view-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: scaling-view
    namespace: boutique
